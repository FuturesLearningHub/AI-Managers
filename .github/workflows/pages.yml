# Keeps the published site in sync: every push to main is mirrored to the
# gh-pages branch, which GitHub Pages serves (deploy from branch, root).
# The gh-pages branch is publish output; never commit to it directly.
name: Mirror main to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
